name: lesson-reminder

on:
  schedule:
    # GitHub-крон запізнюється на години або пропускає запуски: стукаємо щогодини,
    # concurrency тримає рівно один живий джоб, решта чекає в черзі → бот працює 24/7
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # зберегти зашифрований members.enc
  actions: write   # перезапустити самого себе

concurrency:
  group: bot  # другий запуск чекає, поки перший закінчиться: без дублів повідомлень
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          ASU_LOGIN: ${{ secrets.ASU_LOGIN }}
          ASU_PASSWORD: ${{ secrets.ASU_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MEMBERS_KEY: ${{ secrets.MEMBERS_KEY }}
          MAX_HOURS: "5.8"
          PYTHONUNBUFFERED: "1"
      - name: Save encrypted members
        if: always()
        run: |
          git config user.name asu-bot
          git config user.email asu-bot@users.noreply.github.com
          git add members.enc 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update members" && git pull --rebase -q && git push)
      # Крону GitHub не можна вірити: бот сам запускає наступний прогін.
      # Тільки при успіху, щоб зламаний логін не крутився по колу кожні 15 с (тоді чекаємо крон).
      - name: Restart self
        if: success()
        run: gh workflow run bot.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
