name: lesson-reminder

on:
  schedule:
    # Київ = UTC+2 взимку: старт о 07:30 і 13:20 за Києвом, кожен джоб живе до 5 год 50 хв
    - cron: "30 5 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:

concurrency:
  group: bot  # другий запуск чекає, поки перший закінчиться: без дублів повідомлень
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          ASU_LOGIN: ${{ secrets.ASU_LOGIN }}
          ASU_PASSWORD: ${{ secrets.ASU_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MAX_HOURS: "5.8"
          PYTHONUNBUFFERED: "1"
